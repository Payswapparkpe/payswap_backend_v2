# DEVOPS-001: Basic CI for backend check and frontend build
# VAPT-007: Secrets scanning gate (gitleaks) fails build if high-confidence secrets detected
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: test-secret-key-min-50-chars-for-pydantic-validation-xxxx
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!!!!!
      SIGNING_SECRET: test-signing-secret-32-chars-long!!!!!!
      JWT_SIGNING_KEY: test-jwt-signing-key-32-chars-long!!!!!!
      KALEYRA_API_KEY: test
      KALEYRA_SID: test
      SMTP_USER: test
      SMTP_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Django check
        working-directory: backend
        run: python manage.py check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Microcopy quality check
        working-directory: frontend
        run: npm run copy:check
      - name: Build ParkPe
        working-directory: frontend
        run: npx ng build parkpe --configuration=development
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get (parkpe_app)
        working-directory: parkpe_app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: parkpe_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter test
        working-directory: parkpe_app
        run: flutter test
