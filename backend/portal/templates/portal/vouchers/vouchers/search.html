{% extends "base.html" %}
{% load static %}

{% block page_title %}Search Voucher{% endblock %}

{% block content %}
<!-- Enterprise Page Header -->
<div class="page-header-enterprise">
    <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-lg bg-blue-100 flex items-center justify-center">
            <i class="ti ti-search text-xl text-blue-600"></i>
        </div>
        <div>
            <h1 class="page-title-enterprise">Search Voucher</h1>
            <p class="page-description-enterprise">Find voucher by code</p>
        </div>
    </div>
    <a href="/vouchers/" class="btn-enterprise-outline">
        <i class="ti ti-arrow-left mr-2"></i>
        Back to Vouchers
    </a>
</div>

<!-- Search Form Card -->
<div class="card-enterprise max-w-2xl">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label class="form-label-enterprise">Voucher Code <span class="text-red-500">*</span></label>
            <input type="text" name="voucher_code" required class="form-input-enterprise font-mono" placeholder="XXXX-XXXX-XXXX-XXXX">
            <p class="text-xs text-gray-500 mt-1">Enter the 16-digit voucher code (with or without hyphens)</p>
        </div>
        
        <div class="flex gap-4 pt-4">
            <button type="submit" class="btn-enterprise-primary">
                <i class="ti ti-search mr-2"></i>
                Search
            </button>
            <a href="/vouchers/" class="btn-enterprise-outline">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
