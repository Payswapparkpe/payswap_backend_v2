{% extends "base.html" %}
{% load static %}

{% block page_title %}Retailer Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Enterprise Page Header -->
    <div class="page-header-enterprise">
        <div>
            <h1 class="page-title-enterprise">Retailer Dashboard</h1>
            <p class="page-description-enterprise">Welcome, {{ user.username }}! Manage your retail operations</p>
        </div>
    </div>
    
    <!-- Welcome Card -->
    <div class="card-enterprise">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-xl font-semibold text-gray-900 mb-2">Retailer Portal</h2>
                <p class="text-gray-600">Access retailer-specific features and services</p>
            </div>
            <div class="w-16 h-16 rounded-lg bg-teal-100 flex items-center justify-center">
                <i class="ti ti-shopping-cart text-3xl text-teal-600"></i>
            </div>
        </div>
    </div>
</div>
{% endblock %}
