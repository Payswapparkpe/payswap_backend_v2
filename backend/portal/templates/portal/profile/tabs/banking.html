<form method="post" action="{% url 'profile_save' %}" class="space-y-6">
    {% csrf_token %}
    <input type="hidden" name="section" value="banking">
    <div class="card-enterprise">
        <h3 class="card-enterprise-title mb-4">Banking Information</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for field in banking_form %}
            <div>
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="flex justify-end">
        <button type="submit" class="btn-enterprise-primary">Save Banking Details</button>
    </div>
</form>
