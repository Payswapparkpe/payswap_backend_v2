{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication - Payswap{% endblock %}</title>
    
    <!-- Ubuntu Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS 4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PACE.js -->
    <link rel="stylesheet" href="{% static 'portal/css/pace-theme.css' %}">
    <script src="{% static 'portal/js/pace.min.js' %}"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'portal/css/custom.css' %}">
    
    <!-- Custom JS -->
    <script src="{% static 'portal/js/custom.js' %}"></script>
    
    <!-- Toaster Notification System -->
    <script src="{% static 'portal/js/toaster.js' %}"></script>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-white font-['Ubuntu'] min-h-screen">
    <!-- PACE Progress Bar -->
    <div class="pace pace-inactive">
        <div class="pace-progress" data-progress-text="100%" data-progress="99" style="width: 100%;">
            <div class="pace-progress-inner"></div>
        </div>
        <div class="pace-activity"></div>
    </div>
    
    <!-- Django Messages - Will be converted to toaster notifications -->
    {% if messages %}
    <div data-django-messages style="display: none;">
        {% for message in messages %}
        <div data-message data-type="{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    
    {% block auth_content %}{% endblock %}
    
    {% block extra_js %}{% endblock %}
</body>
</html>
