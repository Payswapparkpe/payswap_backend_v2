{% extends "base.html" %}
{% load static %}

{% block page_title %}Create User{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Create User</h2>
        
        <form method="post" action="/users/create/" hx-post="/users/create/" hx-target="#user-form" hx-swap="innerHTML">
            {% csrf_token %}
            <div id="user-form">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                    </div>
                    
                    <div>
                        <label for="role_code" class="block text-sm font-medium text-gray-700 mb-2">Role *</label>
                        <select 
                            id="role_code" 
                            name="role_code" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                            <option value="">Select role</option>
                            <option value="admin">Admin</option>
                            <option value="employee">Employee</option>
                            <option value="super">Super</option>
                            <option value="distributor">Distributor</option>
                            <option value="retailer">Retailer</option>
                            <option value="customer">Customer</option>
                            <option value="vendor">Vendor</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="profile" class="block text-sm font-medium text-gray-700 mb-2">Profile</label>
                        <select 
                            id="profile" 
                            name="profile"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                            <option value="">Select profile (optional)</option>
                            {% for profile in profiles %}
                            <option value="{{ profile.id }}">{{ profile.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="password1" class="block text-sm font-medium text-gray-700 mb-2">Password *</label>
                        <input 
                            type="password" 
                            id="password1" 
                            name="password1" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                    </div>
                    
                    <div>
                        <label for="password2" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password *</label>
                        <input 
                            type="password" 
                            id="password2" 
                            name="password2" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                    </div>
                    
                    <button 
                        type="submit" 
                        class="w-full bg-[#0066CC] text-white py-3 rounded-lg font-semibold hover:bg-[#0052A3] transition"
                    >
                        Create User
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
