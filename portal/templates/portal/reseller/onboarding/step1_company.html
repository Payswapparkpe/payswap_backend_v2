{% extends "portal/templates/base.html" %}
{% load static %}

{% block title %}Onboarding - Step 1{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Reseller Partner Onboarding</h1>
        <p class="text-gray-600 mt-2">Step 1 of 2: Company Information</p>
    </div>

    <form method="post" class="bg-white rounded-lg shadow p-6">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Company Name *</label>
            <input type="text" name="company_name" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Business Type *</label>
            <select name="business_type" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
                <option value="">Select...</option>
                <option value="LLP">Limited Liability Partnership</option>
                <option value="PRIVATE_LTD">Private Limited</option>
                <option value="PUBLIC_LTD">Public Limited</option>
                <option value="PARTNERSHIP">Partnership</option>
                <option value="SOLE_PROPRIETORSHIP">Sole Proprietorship</option>
                <option value="HUF">Hindu Undivided Family</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">GST Number (Optional)</label>
            <input type="text" name="gst_number" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Business Address *</label>
            <textarea name="address" required rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md"></textarea>
        </div>

        <div class="flex justify-end gap-4">
            <a href="{% url 'reseller_dashboard' %}" class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Next Step</button>
        </div>
    </form>
</div>
{% endblock %}
