{% extends "base.html" %}
{% load static %}

{% block page_title %}Create Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Create Profile</h2>
        
        <form method="post" action="/profile/create/" hx-post="/profile/create/" hx-target="#profile-form" hx-swap="innerHTML">
            {% csrf_token %}
            <div id="profile-form">
                <div class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                    </div>
                    
                    <div>
                        <label for="type" class="block text-sm font-medium text-gray-700 mb-2">Profile Type *</label>
                        <select 
                            id="type" 
                            name="type" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                            <option value="individual">Individual</option>
                            <option value="business">Business</option>
                        </select>
                    </div>
                    
                    <div id="business-fields" style="display: none;">
                        <div>
                            <label for="business_name" class="block text-sm font-medium text-gray-700 mb-2">Business Name</label>
                            <input 
                                type="text" 
                                id="business_name" 
                                name="business_name"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                            >
                        </div>
                        
                        <div>
                            <label for="tax_id" class="block text-sm font-medium text-gray-700 mb-2">Tax ID (GST/PAN)</label>
                            <input 
                                type="text" 
                                id="tax_id" 
                                name="tax_id"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                            >
                        </div>
                    </div>
                    
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number *</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        >
                    </div>
                    
                    <div>
                        <label for="address" class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                        <textarea 
                            id="address" 
                            name="address"
                            rows="3"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                        ></textarea>
                    </div>
                    
                    <button 
                        type="submit" 
                        class="w-full bg-[#0066CC] text-white py-3 rounded-lg font-semibold hover:bg-[#0052A3] transition"
                    >
                        Create Profile
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Show/hide business fields
    document.getElementById('type').addEventListener('change', function() {
        const businessFields = document.getElementById('business-fields');
        if (this.value === 'business') {
            businessFields.style.display = 'block';
        } else {
            businessFields.style.display = 'none';
        }
    });
</script>
{% endblock %}
