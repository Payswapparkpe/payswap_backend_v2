{% extends "auth_base.html" %}
{% load static %}

{% block auth_subtitle %}Create Your Account{% endblock %}

{% block auth_content %}
<h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Sign Up</h2>

<form method="post" action="/signup/" hx-post="/signup/" hx-target="#auth-form" hx-swap="innerHTML">
    {% csrf_token %}
    <div id="auth-form">
        <div class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                    placeholder="Enter your email"
                >
            </div>
            
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                    placeholder="Enter your phone number"
                >
            </div>
            
            <div>
                <label for="password1" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="password1" 
                    name="password1" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                    placeholder="Create a password"
                >
            </div>
            
            <div>
                <label for="password2" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                <input 
                    type="password" 
                    id="password2" 
                    name="password2" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                    placeholder="Confirm your password"
                >
            </div>
            
            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-2">Account Type</label>
                <select 
                    id="role" 
                    name="role_code" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-[#0066CC] focus:ring-2 focus:ring-[#0066CC] focus:ring-opacity-20"
                >
                    <option value="">Select account type</option>
                    <option value="customer">Customer</option>
                    <option value="retailer">Retailer</option>
                </select>
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" id="terms" name="terms" required class="mr-2">
                <label for="terms" class="text-sm text-gray-600">
                    I agree to the <a href="#" class="text-[#0066CC] hover:underline">Terms & Conditions</a>
                </label>
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-[#0066CC] text-white py-3 rounded-lg font-semibold hover:bg-[#0052A3] transition"
            >
                Create Account
            </button>
        </div>
    </div>
</form>
{% endblock %}

{% block auth_footer %}
<p class="text-gray-600">
    Already have an account? 
    <a href="/signin/" class="text-[#0066CC] hover:underline font-semibold">Sign In</a>
</p>
{% endblock %}
