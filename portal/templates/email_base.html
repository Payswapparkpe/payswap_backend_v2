<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Payswap{% endblock %}</title>
    <style>
        body {
            font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #F9FAFB;
            color: #1F2937;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 10px 50px;
            overflow: hidden;
        }
        .email-header {
            background-color: #0066CC;
            color: #FFFFFF;
            padding: 2rem;
            text-align: center;
        }
        .email-body {
            padding: 2rem;
        }
        .email-footer {
            background-color: #F9FAFB;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6B7280;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #0066CC;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1 style="margin: 0; font-size: 1.5rem;">Payswap</h1>
        </div>
        <div class="email-body">
            {% block email_content %}{% endblock %}
        </div>
        <div class="email-footer">
            <p style="margin: 0;">© {% now "Y" %} Payswap. All rights reserved.</p>
            <p style="margin: 0.5rem 0 0 0; font-size: 0.75rem;">This is an automated email. Please do not reply.</p>
        </div>
    </div>
</body>
</html>
