{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Primary Meta Tags -->
    <title>{% block title %}Payswap - Digital Payment Infrastructure{% endblock %}</title>
    <meta name="title" content="{% block meta_title %}Payswap - Digital Payment Infrastructure & Bill Payment Solutions{% endblock %}">
    <meta name="description" content="{% block meta_description %}Secure, scalable, and compliant payment infrastructure for businesses, government bodies, and service providers. Pay bills, manage wallets, and process payments seamlessly.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}digital payments, bill payment, fintech, payment gateway, wallet, KYC, RBI compliant, payment infrastructure{% endblock %}">
    <meta name="author" content="Payswap">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://payswap.com/{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Payswap - Digital Payment Infrastructure{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Secure payment solutions made simple. Empowering businesses with compliant payment infrastructure.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% static 'portal/images/small-logo.png' %}{% endblock %}">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{% block twitter_url %}https://payswap.com/{% endblock %}">
    <meta property="twitter:title" content="{% block twitter_title %}Payswap - Digital Payment Infrastructure{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}Secure payment solutions made simple.{% endblock %}">
    <meta property="twitter:image" content="{% block twitter_image %}{% static 'portal/images/small-logo.png' %}{% endblock %}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'portal/images/small-logo.png' %}">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- Ubuntu Font with display=swap for performance -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS 4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PACE.js - Loading indicator -->
    <link rel="stylesheet" href="{% static 'portal/css/pace-theme.css' %}">
    <script src="{% static 'portal/js/pace.min.js' %}" defer></script>
    
    <!-- Alpine.js - Reactive framework -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX - Dynamic HTML -->
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'portal/css/custom.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-white font-['Ubuntu']" itemscope itemtype="https://schema.org/WebSite">
    <!-- PACE Progress Bar -->
    <div class="pace pace-inactive">
        <div class="pace-progress" data-progress-text="100%" data-progress="99" style="width: 100%;">
            <div class="pace-progress-inner"></div>
        </div>
        <div class="pace-activity"></div>
    </div>
    
    {% block content %}{% endblock %}
    
    <!-- Custom JS - Loaded at end for better performance -->
    <script src="{% static 'portal/js/custom.js' %}" defer></script>
    
    {% block extra_js %}{% endblock %}
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "Payswap",
        "description": "Digital Payment Infrastructure & Bill Payment Solutions",
        "url": "https://payswap.com",
        "logo": "{% static 'portal/images/small-logo.png' %}",
        "sameAs": [
            "https://www.facebook.com/payswap",
            "https://www.twitter.com/payswap",
            "https://www.linkedin.com/company/payswap"
        ],
        "areaServed": "IN",
        "serviceType": "Payment Processing"
    }
    </script>
</body>
</html>
