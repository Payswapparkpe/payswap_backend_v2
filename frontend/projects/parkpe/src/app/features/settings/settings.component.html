<div class="settings-container">
  <a routerLink="/dashboard" class="back-link">
    <span class="material-icons">arrow_back</span> Back to Dashboard
  </a>
  <h1 class="settings-title">Settings</h1>

  <app-settings-language-section
    [selectedLanguage]="selectedLanguage"
    [supportedLanguages]="supportedLanguages"
    (languageChange)="changeLanguage($event)"
  />

  <app-settings-notifications-section
    [pushEnabled]="pushEnabled"
    [emailEnabled]="emailEnabled"
    (pushChange)="togglePush()"
    (emailChange)="toggleEmail()"
  />

  <app-settings-account-section [user]="user()" (logoutClick)="logout()" />

  <section class="settings-pin card">
    <h2>{{ pinTitle() }}</h2>
    <p class="pin-note">
      Idle lock screen unlock ke liye 4-6 digit PIN use hota hai.
    </p>
    <form [formGroup]="pinForm" (ngSubmit)="saveSessionPin()" class="pin-form">
      @if (hasSessionPin()) {
        <div class="field">
          <label for="current-pin">Current PIN</label>
          <input
            id="current-pin"
            type="password"
            formControlName="currentPin"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter current PIN"
          />
        </div>
      }
      <div class="field">
        <label for="new-pin">New PIN</label>
        <input
          id="new-pin"
          type="password"
          formControlName="newPin"
          maxlength="6"
          inputmode="numeric"
          placeholder="4-6 digits"
        />
      </div>
      <div class="field">
        <label for="confirm-pin">Confirm PIN</label>
        <input
          id="confirm-pin"
          type="password"
          formControlName="confirmPin"
          maxlength="6"
          inputmode="numeric"
          placeholder="Re-enter new PIN"
        />
      </div>
      <button type="submit" class="btn btn-primary">
        {{ hasSessionPin() ? 'Update PIN' : 'Set PIN' }}
      </button>
    </form>

    <div class="forgot-pin-divider"></div>
    <h3 class="forgot-pin-title">Forgot PIN via OTP</h3>
    <p class="pin-note">Registered mobile par OTP aayega. Verify karne ke baad naya PIN set hoga.</p>
    <div class="otp-row">
      <button type="button" class="btn btn-outline" (click)="requestForgotPinOtp()" [disabled]="otpSending">
        {{ otpSending ? 'Sending OTP…' : 'Send OTP' }}
      </button>
      @if (otpSent) {
        <span class="otp-sent-chip">OTP sent</span>
      }
    </div>

    @if (otpSent) {
      <form [formGroup]="forgotPinForm" (ngSubmit)="resetPinWithOtp()" class="pin-form forgot-pin-form">
        <div class="field">
          <label for="forgot-otp">OTP</label>
          <input
            id="forgot-otp"
            type="text"
            formControlName="otp"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter OTP"
          />
        </div>
        <div class="field">
          <label for="forgot-new-pin">New PIN</label>
          <input
            id="forgot-new-pin"
            type="password"
            formControlName="newPin"
            maxlength="6"
            inputmode="numeric"
            placeholder="4-6 digits"
          />
        </div>
        <div class="field">
          <label for="forgot-confirm-pin">Confirm PIN</label>
          <input
            id="forgot-confirm-pin"
            type="password"
            formControlName="confirmPin"
            maxlength="6"
            inputmode="numeric"
            placeholder="Re-enter new PIN"
          />
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="otpVerifying">
          {{ otpVerifying ? 'Verifying…' : 'Verify OTP & Reset PIN' }}
        </button>
      </form>
    }
  </section>

  <app-settings-about-section [appVersion]="appVersion" [useMockApi]="useMockApi" />
</div>
