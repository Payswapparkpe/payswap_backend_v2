<div class="min-h-screen bg-slate-950 text-white p-6">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">Partner Dashboard</h1>
      <button class="rounded-lg border border-white/20 px-4 py-2 hover:bg-white/10" (click)="logout()">Logout</button>
    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="rounded-xl border border-white/10 bg-white/5 p-4">
        <p class="text-sm text-slate-300">Wallet Balance</p>
        <p class="text-2xl font-semibold mt-2">INR 0.00</p>
      </div>
      <div class="rounded-xl border border-white/10 bg-white/5 p-4">
        <p class="text-sm text-slate-300">Today's Transactions</p>
        <p class="text-2xl font-semibold mt-2">0</p>
      </div>
      <div class="rounded-xl border border-white/10 bg-white/5 p-4">
        <p class="text-sm text-slate-300">Pending Settlements</p>
        <p class="text-2xl font-semibold mt-2">0</p>
      </div>
    </div>

    <div class="rounded-xl border border-white/10 bg-white/5 p-4">
      <p class="text-sm text-slate-300">Signed in as</p>
      <p class="text-lg mt-2">{{ (user$ | async)?.name }} ({{ (user$ | async)?.roleCode }})</p>
    </div>
  </div>
</div>
